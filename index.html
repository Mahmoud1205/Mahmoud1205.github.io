<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Mahmoud</title>
	<link rel="stylesheet" href="https://unpkg.com/7.css">

	<style>
		html, body {
			margin: 0;

		.window {
			margin: 16px;
		}

		.background {
			background-image: url('/assets/img/bg.jpg');

			background-position: center;
			background-repeat: no-repeat;
			min-height: 100vh;

			position: fixed;
			top: 0;
			left: 0;

<body>
	<div class="background">
		<div class="window glass active" style="max-width: 100%;">
			<div class="title-bar">
				<div class="title-bar-text">Mahmoud's Portfolio</div>
				<div class="title-bar-controls">
					<!-- <button aria-label="Help"></button> -->
					<button aria-label="Minimize" disabled></button>
					<button aria-label="Maximize" disabled></button>
					<button aria-label="Close" onclick="window.location.href = 'https://www.google.com/'"></button>
				</div>
			</div>
			<div class="window-body has-space">
				<menu role="tablist" aria-label="Window with Tabs">
					<button role="tab" aria-controls="AboutMe" aria-selected="true">About Me</button>
					<button role="tab" aria-controls="Projects">Projects</button>
					<button role="tab" aria-controls="Blog">Blog</button>
					<button role="tab" aria-controls="ContactMe">Contact Me</button>
				</menu>

				<article role="tabpanel" id="AboutMe">
					<h1>About Me</h1>
					<p>TODO: fill in</p>
				</article>

				<article role="tabpanel" hidden id="Projects">
					<p>TODO: fill in</p>
				</article>

				<article role="tabpanel" hidden id="Blog">
					<p>TODO: fill in</p>
				</article>

				<article role="tabpanel" hidden id="ContactMe">
					<p>TODO: fill in</p>
				</article>
			</div> <!-- class="window-body has-space" -->
		</div>
	</div>

	<script>
		document.addEventListener("DOMContentLoaded", () => {
			const tabs = document.querySelectorAll('[role="tab"]');
			const tabPanels = document.querySelectorAll('[role="tabpanel"]');

			tabs.forEach(tab => {
				tab.addEventListener("click", () => {
					// Unselect all tabs
					tabs.forEach(t => t.setAttribute("aria-selected", "false"));
					// Hide all panels
					tabPanels.forEach(panel => panel.hidden = true);

					// Select clicked tab
					tab.setAttribute("aria-selected", "true");
					// Show related panel
					const targetPanel = document.getElementById(tab.getAttribute("aria-controls"));
					targetPanel.hidden = false;
				});
			});
		});
	</script>

</body>
