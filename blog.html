---
layout: default
title: Blog
active_tab: blog
---

<h1>Blog</h1>
{% for post in site.posts %}
	<a href="{{ post.url }}">
		<fieldset style="max-width: 570px !important;">
			<legend><h3>{{ post.title }} — {{ post.date | date: "%B %d, %Y" }}</h3></legend>
			<p style="margin-top: -12px; margin-bottom: 4px;">{{ post.desc }}</p>
		</fieldset>
	</a>
{% endfor %}
