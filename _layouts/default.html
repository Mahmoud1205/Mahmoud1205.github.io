	<script>
	function loadHighlight() {
		if (window.hljs)
			return;

		const script = document.createElement('script');
		script.src = "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js";
		script.onload = () => hljs.highlightAll();
		document.head.appendChild(script);
	}
	</script>

		pre[class*="language-"] code:not(.code-inline){

		}

		pre {

		}

<body>
	<div class="window glass active" style="max-width: 100%;">

				<!-- <button aria-label="Help"></button> -->
				<button aria-label="Minimize" disabled></button>
				<button aria-label="Maximize" disabled></button>
				<button id="close-btn" aria-label="Close" disabled></button>
			</div>
		</div>
		<div class="window-body has-space has-scrollbar">
			<section class="tabs">
			{% include menu.html %}
			{{ content }}
			</section>
		</div>

		<div class="status-bar">
			<p class="status-bar-field">Name: Mahmoud</p>
			<p class="status-bar-field">Nationality: Egypt</p>
			<p class="status-bar-field">Current Project: Athan Lamp</p>
		</div>
	</div>

	<script>
		loadHighlight();

		function getIsMainPage()
		{
			let isMainPage = window.location.pathname == "/";
			return isMainPage;
		}

		document.addEventListener("DOMContentLoaded", () => {
			const closeBtn = document.getElementById("close-btn");

			let isMainPage = getIsMainPage();
			if (!isMainPage)
				closeBtn.disabled = false;
			else
				closeBtn.disabled = true;

			closeBtn.addEventListener("click", () => {
				let isMainPage = getIsMainPage();
				if (!isMainPage)
					window.location.href = "/";
			});
		});
	</script>
</body>
